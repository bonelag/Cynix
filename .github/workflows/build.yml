name: Build & Upload APK

on:
  push:
    branches:
      - main
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Init submodules
      run: git submodule update --init --recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK components
      run: sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33" "ndk;27.0.12077973" "cmake;3.22.1"

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" >> local.properties

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleNonRoot_gameRelease

    - name: Get versionName and rename APK
      id: get_version
      run: |
        VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*versionName "\(.*\)"/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        APK_DIR="app/build/outputs/apk/nonRoot_game/release"
        
        for apk in "$APK_DIR"/app-nonRoot_game-*-release.apk; do
          if [ -f "$apk" ]; then
            ABI=$(basename "$apk" | sed 's/app-nonRoot_game-\(.*\)-release.apk/\1/')
            NEW_NAME="Cynix_${VERSION}_${ABI}.apk"
            cp "$apk" "$APK_DIR/$NEW_NAME"
            echo "Renamed $(basename "$apk") to $NEW_NAME"
          fi
        done
        
        echo "apk_dir=$APK_DIR" >> $GITHUB_OUTPUT

    - name: Upload APK (Artifact or GitHub Release)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.get_version.outputs.apk_dir }}/Cynix_*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK to GitHub Actions Artifacts
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: APK-Build
        path: ${{ steps.get_version.outputs.apk_dir }}/Cynix_*.apk

    - name: Check and update existing release
      if: github.event_name == 'workflow_dispatch'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.get_version.outputs.tag }}
        VERSION: ${{ steps.get_version.outputs.version }}
        APK_DIR: ${{ steps.get_version.outputs.apk_dir }}
      run: |
        # Check if release with this tag exists
        RELEASE_ID=$(gh release view "$TAG" --json id --jq '.id' 2>/dev/null || echo "")

        if [ -n "$RELEASE_ID" ]; then
          echo "Release $TAG already exists. Replacing APK assets..."
          for apk in "$APK_DIR"/Cynix_*.apk; do
            APK_NAME=$(basename "$apk")
            gh release delete-asset "$TAG" "$APK_NAME" --yes 2>/dev/null || true
            gh release upload "$TAG" "$apk" --clobber
            echo "Uploaded $APK_NAME to release $TAG"
          done
        else
          echo "Creating new release $TAG..."
          gh release create "$TAG" "$APK_DIR"/Cynix_*.apk --title "Cynix $VERSION" --notes "Build $VERSION" --latest
          echo "Release $TAG created successfully"
        fi